---
services:
  postgres:
    image: postgres:18-alpine
    # GRANIAN_BACKPRESSURE below lets Netbox run up to 100 requests at once, and
    # Django holds a connection per in-flight request (plus the housekeeping and
    # rq ones, ~40 at idle). Postgres defaults to 100 connections, so the app's
    # own concurrency limit could exhaust the database before backpressure ever
    # applied: the suite failed with "sorry, too many clients already" whenever
    # go test ran unthrottled. Give the pool room for the concurrency Netbox is
    # configured to use.
    command: postgres -c max_connections=300
    environment:
      - POSTGRES_USER=netbox
      - POSTGRES_PASSWORD=netbox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:
    image: docker.io/valkey/valkey:9.0-alpine
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  netbox:
    image: netboxcommunity/netbox:${NETBOX_VERSION}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8080"
    environment:
      - DB_USER=netbox
      - DB_PASSWORD=netbox
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - SECRET_KEY=0123456789abcdefghij0123456789abcdefghij0123456789
      - SUPERUSER_PASSWORD=admin
      # The admin's v2 token, nbt_<key>.<token>, is what the acceptance tests authenticate with
      # (NETBOX_API_TOKEN in the GNUmakefile). NetBox creates no token without a pepper.
      - SUPERUSER_API_TOKEN=Iw2JZtpMdYjBuIVIZLItd4lB2RYEiv6xhY23W0tQ
      - SUPERUSER_API_KEY=mrcLJrER9ves
      - API_TOKEN_PEPPER_1=C9Bp3tmBgchWcWc2OkoFuaV9aoKZfhJgZUBG7g0PFxYzf1AkLd
      - GRANIAN_BACKPRESSURE=100
    # Gate on a real readiness signal: /login/ only serves 200 once migrations
    # have run and the app is up (matches netbox-community/netbox-docker). The
    # previous /metrics check went green before Netbox was actually ready,
    # racing the acceptance tests.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login/"]
      interval: 15s
      timeout: 5s
      # Generous headroom: migrations on a cold/slow CI runner can take well
      # over a minute. A successful check during start_period still marks the
      # container healthy immediately, so a large value never delays readiness
      # detection -- it only widens the grace window before giving up.
      # start_period (180s) + retries*interval (20*15s) => up to ~8min tolerance.
      retries: 20
      start_period: 180s
